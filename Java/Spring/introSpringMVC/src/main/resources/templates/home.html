<!doctype html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" th:href="@{/styles/home.css}">
    <title>Liste de motos</title>
</head>
<body>
    <h1>Liste de motos</h1>
    <ul>
        <li th:each="motos: ${motos}">
            <a th:href="@{/{id}(id=${motos.id})}">
                <span th:text="${motos.brand} + ' ' + ${motos.model}"></span>
                <span th:text="' - ' + ${motos.cc} + ' cc'"></span>
            </a>
        </li>
    </ul>
    <form method="get" th:action="@{/}">
        <label for="brand">Filtrer par marque</label>

        <select name="brand" id="brand" onchange="this.form.submit()">
            <option value="">Toutes les marques</option>

            <option th:each="motos : ${motos}"
                    th:value="${motos.brand}"
                    th:text="${motos.brand}">
            </option>
        </select>
    </form>
</body>
</html>

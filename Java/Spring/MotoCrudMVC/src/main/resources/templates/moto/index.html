<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Motos</title>
</head>
<body>
<h1>Liste des motos</h1>

<p><a th:href="@{/motos/create}">Ajouter une moto</a></p>

<form method="get" th:action="@{/motos}">
    <label for="brand">Filtrer par marque</label>
    <select name="brand" id="brand" onchange="this.form.submit()">
        <option value="">Toutes les marques</option>
        <option th:each="motoBrand : ${brands}"
                th:value="${motoBrand}"
                th:text="${motoBrand}"
                th:selected="${motoBrand == brand}">
        </option>
    </select>
</form>

<ul>
    <li th:each="moto : ${motos}">
        <a th:href="@{/motos/{id}(id=${moto.id})}">
            <span th:text="${moto.brand} + ' ' + ${moto.model}"></span>
            <span th:text="' - ' + ${moto.cc} + ' cc'"></span>
        </a>
    </li>
</ul>
</body>
</html>

<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Détail de la moto')}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container py-5 flex-grow-1">
    <div class="mb-4">
        <a class="text-decoration-none text-secondary" th:href="@{/motos}">← Retour à la liste</a>
    </div>

    <div class="card detail-card overflow-hidden">
        <div class="row g-0">
            <div class="col-12 col-lg-7">
                <img th:if="${moto.imageUrl != null && !moto.imageUrl.isBlank()}"
                     th:src="${moto.imageUrl}"
                     th:alt="${moto.brand + ' ' + moto.model}"
                     class="moto-image-detail">

                <div th:unless="${moto.imageUrl != null && !moto.imageUrl.isBlank()}"
                     class="moto-placeholder h-100" style="min-height: 320px;" aria-label="Aucune image">
                    🏍️
                </div>
            </div>

            <div class="col-12 col-lg-5">
                <div class="card-body p-4 p-md-5 h-100 d-flex flex-column">
                    <div class="mb-3">
                        <span class="badge rounded-pill category-badge"
                              th:text="${moto.category.name}">Catégorie</span>
                    </div>

                    <h1 class="page-title fw-bold mb-2" th:text="${moto.brand + ' ' + moto.model}">Moto</h1>
                    <p class="fs-5 text-secondary mb-4" th:text="${moto.cc + ' cc'}">0 cc</p>
                    <p class="fs-5 text-secondary mb-4" th:text="${moto.description}">Description</p>

                    <div class="mt-auto d-flex flex-wrap gap-2">
                        <a class="btn btn-primary"
                           th:href="@{/motos/update/{id}(id=${moto.id})}">Modifier</a>

                        <form th:action="@{/motos/delete/{id}(id=${moto.id})}"
                              method="post"
                              onsubmit="return confirm('Supprimer cette moto ?');">
                            <button class="btn btn-outline-danger" type="submit">Supprimer</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

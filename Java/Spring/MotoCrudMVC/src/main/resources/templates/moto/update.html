<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Modifier une moto')}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="mb-4">
                <a class="text-decoration-none text-secondary"
                   th:href="@{/motos/{id}(id=${moto.id})}">← Retour à la fiche</a>
                <h1 class="page-title fw-bold mt-3 mb-1">Modifier la moto</h1>
                <p class="text-secondary mb-0"
                   th:text="${moto.brand + ' ' + moto.model}">Moto</p>
            </div>

            <div class="card form-card">
                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/motos/update/{id}(id=${moto.id})}" method="post" th:object="${moto}">
                        <div class="row g-4">
                            <div class="col-12 col-md-6">
                                <label for="brand" class="form-label fw-semibold">Marque</label>
                                <input type="text" id="brand" class="form-control" th:field="*{brand}">
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="model" class="form-label fw-semibold">Modèle</label>
                                <input type="text" id="model" class="form-control" th:field="*{model}">
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="cc" class="form-label fw-semibold">Cylindrée</label>
                                <div class="input-group">
                                    <input type="number" id="cc" class="form-control" th:field="*{cc}" min="1">
                                    <span class="input-group-text">cc</span>
                                </div>
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('cc')}" th:errors="*{cc}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="category" class="form-label fw-semibold">Catégorie</label>
                                <select id="category" name="categoryId" class="form-select" required>
                                    <option th:each="category : ${categories}"
                                            th:value="${category.id}"
                                            th:text="${category.name}"
                                            th:selected="${moto.category != null && category.id == moto.category.id}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="description" class="form-label fw-semibold">Description</label>
                                <textarea id="description" class="form-control" th:field="*{description}"
                                       rows="3" placeholder="Quelques mots sur cette bécane...">
                                </textarea>
                            </div>

                            <div class="col-12">
                                <label for="imageUrl" class="form-label fw-semibold">URL de l'image</label>
                                <input type="url" id="imageUrl" class="form-control" th:field="*{imageUrl}"
                                       placeholder="https://...">
                                <div class="form-text">Laisser vide pour pas afficher d'image.</div>
                            </div>
                        </div>

                        <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 mt-5">
                            <a class="btn btn-outline-secondary"
                               th:href="@{/motos/{id}(id=${moto.id})}">Annuler</a>
                            <button class="btn btn-primary px-4" type="submit">Enregistrer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

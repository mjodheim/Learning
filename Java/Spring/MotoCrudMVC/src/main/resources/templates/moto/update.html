<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Modifier une moto')}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
            <div class="mb-4">
                <a class="text-decoration-none text-secondary"
                   th:href="@{/motos/{id}(id=${motoId})}">← Retour à la fiche</a>
                <h1 class="page-title fw-bold mt-3 mb-1">Modifier la moto</h1>
                <p class="text-secondary mb-0"
                   th:text="${moto.brand + ' ' + moto.model}">Moto</p>
            </div>

            <div class="card form-card">
                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/motos/update/{id}(id=${motoId})}" method="post" th:object="${moto}">
                        <div class="row g-4">
                            <div class="col-12 col-md-6">
                                <label for="brand" class="form-label fw-semibold">Marque</label>
                                <input type="text" id="brand" class="form-control" th:field="*{brand}">
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="model" class="form-label fw-semibold">Modèle</label>
                                <input type="text" id="model" class="form-control" th:field="*{model}">
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="cc" class="form-label fw-semibold">Cylindrée</label>
                                <div class="input-group">
                                    <input type="number" id="cc" class="form-control" th:field="*{cc}" min="50">
                                    <span class="input-group-text">cc</span>
                                </div>
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('cc')}" th:errors="*{cc}"></div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="categoryId" class="form-label fw-semibold">Catégorie</label>
                                <select id="categoryId" class="form-select" th:field="*{categoryId}">
                                    <option value="">Choisir une catégorie</option>
                                    <option th:each="category : ${categories}"
                                            th:value="${category.id}"
                                            th:text="${category.name}">
                                    </option>
                                </select>
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                            </div>

                            <div class="col-12">
                                <label for="description" class="form-label fw-semibold">Description</label>
                                <textarea id="description" class="form-control" th:field="*{description}"
                                          rows="3" placeholder="Quelques mots sur cette bécane..."></textarea>
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                            </div>

                            <div class="col-12">
                                <label for="imageUrl" class="form-label fw-semibold">URL de l'image</label>
                                <input type="url" id="imageUrl" class="form-control" th:field="*{imageUrl}"
                                       placeholder="https://...">
                                <div class="form-text">Laisser vide pour ne pas afficher d'image.</div>
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
                            </div>

                            <div class="col-12">
                                <hr class="my-1">
                                <h2 class="h5 fw-bold mt-3 mb-1">Fiche technique</h2>
                                <p class="text-secondary small mb-0">Ces informations sont optionnelles.</p>
                            </div>

                            <div class="col-12 col-md-4">
                                <label for="horsepower" class="form-label fw-semibold">Puissance</label>
                                <div class="input-group">
                                    <input type="number" id="horsepower" class="form-control"
                                           th:field="*{horsepower}" min="1">
                                    <span class="input-group-text">ch</span>
                                </div>
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('horsepower')}" th:errors="*{horsepower}"></div>
                            </div>

                            <div class="col-12 col-md-4">
                                <label for="weightKg" class="form-label fw-semibold">Poids</label>
                                <div class="input-group">
                                    <input type="number" id="weightKg" class="form-control"
                                           th:field="*{weightKg}" min="1">
                                    <span class="input-group-text">kg</span>
                                </div>
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('weightKg')}" th:errors="*{weightKg}"></div>
                            </div>

                            <div class="col-12 col-md-4">
                                <label for="tankCapacity" class="form-label fw-semibold">Réservoir</label>
                                <div class="input-group">
                                    <input type="number" step="0.1" id="tankCapacity" class="form-control"
                                           th:field="*{tankCapacity}" min="1">
                                    <span class="input-group-text">L</span>
                                </div>
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('tankCapacity')}" th:errors="*{tankCapacity}"></div>
                            </div>

                            <div class="col-12">
                                <hr class="my-1">
                                <h2 class="h5 fw-bold mt-3 mb-3">Équipements</h2>
                                <div class="d-flex flex-wrap gap-3">
                                    <div class="form-check" th:each="equipment : ${equipments}">
                                        <input class="form-check-input"
                                               type="checkbox"
                                               th:field="*{equipmentIds}"
                                               th:value="${equipment.id}"
                                               th:id="${'equipment-' + equipment.id}">
                                        <label class="form-check-label"
                                               th:for="${'equipment-' + equipment.id}"
                                               th:text="${equipment.name}">Équipement</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 mt-5">
                            <a class="btn btn-outline-secondary"
                               th:href="@{/motos/{id}(id=${motoId})}">Annuler</a>
                            <button class="btn btn-primary px-4" type="submit">Enregistrer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · MotoCrudMVC'">MotoCrudMVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/motos}">
            <span class="brand-mark">M</span>
            <span>MotoCrudMVC</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Afficher la navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <a class="nav-link" th:href="@{/motos}">Les motos</a>
                <a class="nav-link d-flex align-items-center gap-2" th:href="@{/cart}">
                    <span>Panier</span>
                    <span class="badge rounded-pill text-bg-light" th:text="${cartItemCount}">0</span>
                </a>
                <a class="btn btn-primary btn-sm px-3" th:href="@{/motos/create}">Ajouter une moto</a>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="mt-auto py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2 text-center text-md-start">
        <span class="fw-semibold">MotoCrudMVC</span>
        <span class="text-secondary">Projet d'apprentissage · Spring Boot · Thymeleaf · JPA/Hibernate</span>
    </div>
</footer>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>

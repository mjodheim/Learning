<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Panier')}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container py-5 flex-grow-1">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
        <div>
            <p class="text-uppercase text-danger fw-semibold small mb-1">Garage Mjodheim</p>
            <h1 class="page-title fw-bold mb-1">Panier</h1>
            <p class="text-secondary mb-0" th:text="${cart.itemCount + ' article(s)'}">0 article</p>
        </div>
        <a class="btn btn-outline-dark" th:href="@{/motos}">Continuer à regarder les motos</a>
    </div>

    <div class="alert alert-light border text-center py-5" th:if="${#lists.isEmpty(cart.lines)}">
        <h2 class="h5">Le panier est vide</h2>
        <p class="text-secondary mb-3">Ajoute une moto depuis le catalogue pour commencer.</p>
        <a class="btn btn-primary" th:href="@{/motos}">Voir les motos</a>
    </div>

    <div class="row g-4" th:unless="${#lists.isEmpty(cart.lines)}">
        <div class="col-12 col-lg-8">
            <div class="card form-card mb-3" th:each="line : ${cart.lines}">
                <div class="card-body p-3 p-md-4">
                    <div class="row align-items-center g-3">
                        <div class="col-12 col-sm-3">
                            <img th:if="${line.imageUrl != null && !line.imageUrl.isBlank()}"
                                 th:src="${line.imageUrl}"
                                 th:alt="${line.brand + ' ' + line.model}"
                                 class="img-fluid rounded">
                            <div th:unless="${line.imageUrl != null && !line.imageUrl.isBlank()}"
                                 class="moto-placeholder rounded" style="min-height: 120px;">🏍️</div>
                        </div>

                        <div class="col-12 col-sm-5">
                            <h2 class="h5 fw-bold mb-1" th:text="${line.brand + ' ' + line.model}">Moto</h2>
                            <p class="text-secondary mb-1" th:text="${line.cc + ' cc'}">0 cc</p>
                            <p class="mb-0" th:text="${line.unitPrice + ' € / unité'}">0.00 €</p>
                        </div>

                        <div class="col-12 col-sm-4 text-sm-end">
                            <div class="d-flex justify-content-sm-end align-items-center gap-2 mb-3">
                                <form th:action="@{/cart/decrease/{id}(id=${line.motoId})}" method="post">
                                    <button class="btn btn-outline-secondary" type="submit" aria-label="Retirer une unité">−</button>
                                </form>

                                <span class="fw-bold px-2" th:text="${line.quantity}">1</span>

                                <form th:action="@{/cart/increase/{id}(id=${line.motoId})}" method="post">
                                    <button class="btn btn-outline-secondary" type="submit" aria-label="Ajouter une unité">+</button>
                                </form>
                            </div>

                            <p class="fw-bold fs-5 mb-2" th:text="${line.subtotal + ' €'}">0.00 €</p>

                            <form th:action="@{/cart/remove/{id}(id=${line.motoId})}" method="post">
                                <button class="btn btn-link text-danger p-0" type="submit">Supprimer</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-4">
            <div class="card detail-card">
                <div class="card-body p-4">
                    <h2 class="h5 fw-bold mb-4">Résumé</h2>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Articles</span>
                        <span th:text="${cart.itemCount}">0</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold">Total</span>
                        <span class="fs-4 fw-bold" th:text="${cart.total + ' €'}">0.00 €</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

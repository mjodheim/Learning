<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Product Index</title>
    <link rel="stylesheet" th:href="@{/css/product/index.css}">
</head>
<body>
    <h1>Product Index</h1>
    <form th:action="@{/product}" method="get">
        <input type="text" name="name" placeholder="Name">
        <input type="number" name="minPrice" placeholder="Min price">
        <input type="number" name="maxPrice" placeholder="Max price">
        <select name="categoryId">
            <option value="" label="Select category" selected></option>
            <option
                    th:each="c : ${categories}"
                    th:value="${c.id}" th:text="${c.name}"></option>
        </select>
        <button type="submit">Submit</button>
    </form>
    <button><a th:href="@{/product/create}">Create new</a></button>
    <ul>
        <li th:each="p : ${products}">
            <p th:text="${p.name}"></p>
            <img th:src="${p.imageUrl}" width="200" height="200" th:alt="${p.name}">
            <a th:href="@{/product/{id}(id=${p.id})}"><button>Details</button></a>
            <a th:href="@{/product/{id}/update(id=${p.id})}"><button>Update</button></a>
        </li>
    </ul>
</body>
</html>
